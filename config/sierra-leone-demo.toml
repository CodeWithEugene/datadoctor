# DataDoctor settings for one DHIS2 instance. A new country = a new file like this, no code changes.
# This one targets the public DHIS2 demo database (Sierra Leone).

name = "Sierra Leone (DHIS2 demo)"
district_level = 2
facility_level = 4

# Datasets whose reporting completeness and timeliness we track.
datasets = ["QX4ZTUbOt3a", "BfMAe6Itzgt"]  # Reproductive Health, Child Health

# Data elements checked for outliers each month.
watch = [
  "fbfJHSPpUQD",  # ANC 1st visit
  "hfdmMSPBgLG",  # ANC 4th or more visits
  "gQNFkFkObU8",  # Live births
  "s46m5MS0hxu",  # BCG doses given
  "fClA2Erf6IO",  # Penta1 doses given
  "n6aMJNLdvep",  # Penta3 doses given
  "YtbsuPPo010",  # Measles doses given
]

# Internal consistency rules: `more` should be >= `less` at every facility, every month.
[[rules]]
more = "fbfJHSPpUQD"
less = "hfdmMSPBgLG"
why = "Fewer women start antenatal care than complete 4 visits"

[[rules]]
more = "fClA2Erf6IO"
less = "n6aMJNLdvep"
why = "More children got their 3rd Penta dose than their 1st"
